<!--
  PWA 图标源文件（仅用于生成本目录下的 png，运行时不直接引用）
  设计：绿色圆角底 + 白色电池+闪电（换电）
  - app-icon：purpose=any，满幅圆角（Android/Chrome 桌面会自己加遮罩）
  - maskable：安全区要求内容集中在中心 80% 圆内，所以底部不透明满幅、图形缩小并下移居中
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ac16b" />
      <stop offset="1" stop-color="#05914f" />
    </linearGradient>
    <symbol id="glyph" viewBox="0 0 512 512">
      <!-- 电池外壳 -->
      <rect
        x="104"
        y="186"
        width="272"
        height="140"
        rx="28"
        fill="none"
        stroke="#ffffff"
        stroke-width="28"
      />
      <!-- 电池正极 -->
      <rect x="388" y="228" width="28" height="56" rx="12" fill="#ffffff" />
      <!-- 闪电 -->
      <path
        d="M268 208 L204 292 L252 292 L232 336 L316 244 L266 244 Z"
        fill="#ffffff"
        stroke="#ffffff"
        stroke-width="10"
        stroke-linejoin="round"
      />
    </symbol>
  </defs>

  <!-- any：满幅圆角底 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <use href="#glyph" />
</svg>
